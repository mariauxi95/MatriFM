        <tr>
          <td align="center" style="padding:36px 32px 8px;">
            <img src="https://matrimarifer.com/images/monograma.png" width="112" height="112" alt="Maru y Fer" style="display:block;border:0;outline:none;width:112px;height:112px;" />
          </td>
        </tr>
        <tr>
          <td align="center" style="padding:8px 32px 0;font-family:Georgia,'Iowan Old Style','Palatino Linotype',Palatino,serif;font-size:32px;line-height:1.1;color:#1e3f36;">

              <tr>

          </td>
        </tr>
        <tr>
          <td style="padding:8px 36px 0;">

              <tr>
                <td style="border-top:1px solid #e4d6af;font-size:0;line-height:0;">&nbsp;</td>
              </tr>
            </table>

        </tr>
        <tr>
